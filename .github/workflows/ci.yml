name: ci
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm ci --ignore-scripts
      - run: npm run schemas
      - run: npx tsc -p tsconfig.json
      - run: npm test
